<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎁 박스깡 시뮬레이터</title>
<style>
html,body{margin:0;padding:0;background:#0b0f14}
#bbWrap{max-width:960px;margin:0 auto;padding:16px 14px 60px;background:#12161c;color:#e8edf3;
font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;word-break:keep-all;min-height:100vh}
#bbWrap *{box-sizing:border-box}
#bbWrap h2{font-size:22px;margin:0 0 4px;letter-spacing:-.5px}
#bbWrap .sub{color:#93a1b3;font-size:13px;margin:0 0 16px;line-height:1.6}
#bbWrap .card{background:#1b222c;border:1px solid #2c3644;border-radius:12px;padding:14px;margin-bottom:14px}
#bbWrap button{font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:9px;
padding:10px 16px;cursor:pointer;background:#2a3542;color:#e8edf3}
#bbWrap button.pri{background:#39c5cf;color:#0c1116}
#bbWrap button.gold{background:linear-gradient(90deg,#f0b429,#e07b39);color:#0c1116}
#bbWrap button:active{transform:translateY(1px)}
#bbWrap button:disabled{opacity:.4;cursor:default}
#bbWrap select{font-family:inherit;font-size:14px;background:#141a22;color:#e8edf3;border:1px solid #2c3644;border-radius:9px;padding:10px 12px;max-width:100%}
.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #2c3644;padding-bottom:12px;margin-bottom:16px}
.nav a{font-size:14px;font-weight:700;color:#93a1b3;background:#1b222c;border:1px solid #2c3644;border-radius:10px;padding:8px 16px;text-decoration:none}
.nav .on{font-size:14px;font-weight:800;color:#0c1116;background:#39c5cf;border-radius:10px;padding:9px 16px}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.badges span,.badges a{font-size:15px;font-weight:800;border-radius:24px;padding:7px 16px;text-decoration:none}
.b1{color:#0c1116;background:linear-gradient(90deg,#39c5cf,#f0b429)}
.b2{color:#f0b429;border:2px solid #f0b429}
.b3{color:#8fe0b0;background:#264a35;border:2px solid #3fb96f}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#packArea{display:none}
.packGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
@media(max-width:560px){.packGrid{grid-template-columns:repeat(3,1fr)}}
.cardSlot{perspective:600px;aspect-ratio:63/88;position:relative;cursor:pointer}
.cardInner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.3,1.1)}
.cardSlot.flip .cardInner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px;text-align:center}
.back{background:repeating-linear-gradient(45deg,#1e2836,#1e2836 8px,#232e3e 8px,#232e3e 16px);border:2px solid #3a4757;font-size:26px}
.front{transform:rotateY(180deg);background:#141a22;border:2px solid #2c3644}
.front.hit{box-shadow:0 0 18px rgba(240,180,41,.45);border-color:#f0b429}
.front .rar{font-size:12px;font-weight:900;border-radius:12px;padding:2px 10px;margin-bottom:6px;color:#fff}
.front .nm{font-size:12px;font-weight:700;line-height:1.35}
.front .pr{font-size:12px;color:#93a1b3;margin-top:5px;font-variant-numeric:tabular-nums}
.front.norm{color:#5f6c7c;font-size:12px}
.front{padding:0;overflow:hidden}
.front .cimg{width:100%;height:100%;object-fit:cover;border-radius:8px}
.front .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(10,14,19,.82);font-size:11px;font-weight:800;color:#e8edf3;padding:4px 4px;display:flex;gap:5px;justify-content:center;align-items:center;font-variant-numeric:tabular-nums}
.front .cap .rar{font-size:10px;padding:1px 7px;margin:0}
#tally{display:none}
.big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.fortune{font-size:20px;font-weight:800;margin-top:6px}
.hitList{font-size:13px;line-height:1.9;margin-top:10px;color:#c9d4e0}
.hitList b{font-variant-numeric:tabular-nums}
.stat{font-size:13px;color:#93a1b3;margin-top:4px;font-variant-numeric:tabular-nums}
.pkLabel{font-size:13px;color:#93a1b3;font-weight:700;margin-top:14px}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){.cardInner{transition:none}.shake{animation:none}}
.foot{font-size:11px;color:#5f6c7c;line-height:1.7;margin-top:8px}
</style>
</head>

<div id="bbWrap">

  <p class="sub">오늘의 운세를 카드로 확인해보세요. 실제 시세 데이터 기반으로 팩을 뜯고, 뽑은 카드의 총 가치와 본전 비교까지 보여줍니다. (재미용 시뮬레이션 — 실제 봉입률과 다를 수 있음)</p>

  <div class="card">
    <div class="row">
      <select id="setSel"></select>
      <button type="button" class="pri" id="btnPack">🃏 팩 1개 뜯기</button>

    </div>
    <p class="stat" id="setInfo"></p>
  </div>

  <div class="card" id="packArea">
    <div class="row">
      <span id="packTitle" style="font-weight:800;font-size:16px"></span>
      <span style="flex:1"></span>
      <button type="button" id="btnFlipAll">⚡ 전체 한번에 까기</button>
      <button type="button" id="btnNext" style="display:none">➡️ 다음 팩</button>
    </div>
    <div id="packs"></div>
  </div>

  <div class="card" id="tally">
    <div style="font-size:13px;color:#93a1b3;font-weight:700">개봉 결과</div>
    <div class="big" id="totalVal"></div>
    <div class="fortune" id="fortune"></div>
    <div class="stat" id="vsCost"></div>
    <div class="hitList" id="hits"></div>
    <div class="row" style="margin-top:12px">
      <button type="button" class="pri" id="btnAgain">🔄 한 번 더!</button>
    </div>
  </div>

  <p class="foot">※ 봉입 확률은 커뮤니티에 알려진 대략적 비율을 단순화한 모델입니다. 카드 시세는 도감 데이터 기준이며 실시간이 아닙니다. 일반 슬롯(노멀/커먼)은 가치 0원으로 계산합니다.</p>
</div>

 'BS2021010':{path:'kr/BS2021010',tries:['P_BR','P','P_B'],ver:'',alt:{path:'kr/BS2021010-kr',tries:['P_BR','P'],ver:''}},

function jpFallbacks(setCode,num){
  var jp=JPCODE[setCode];if(!jp)return [];
  var L2='https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpc/'+jp+'/'+jp+'_';
  return [L2+num+'_R_JP.png',L2+String(parseInt(num,10))+'_R_JP.png','https://cdn.collectory.cc/cards/jp/'+jp+'/'+num+'.webp?v=hr'];
}
function candsFor(cfg,num,base,rar){
  var unp=String(parseInt(num,10));
  var F={P_B:num+'_'+base,P:num,U_B:unp+'_'+base,P_BR:num+'_'+base+rar,U_BR:unp+'_'+base+rar,U:unp};
  return cfg.tries.map(function(t){return CDN2+'/'+cfg.path+'/'+F[t]+'.webp'+cfg.ver});
}
function cardUrls(setCode,c){
  var num=c.num,base=c.base,rar=c.r;
  var unp=String(parseInt(num,10));
  var urls,cfg=IMGCFG[setCode];
  if(cfg){
    urls=candsFor(cfg,num,base,rar);
    if(cfg.alt)urls=urls.concat(candsFor(cfg.alt,num,base,rar));
    urls.push(CDN+'/'+setCode+'/'+num+'_'+base+rar+'.webp',CDN+'/'+setCode+'/'+num+'.webp');
    urls=urls.concat(jpFallbacks(setCode,num));
  }else{
    var cands=(rar==='N'||rar==='M')
      ?[num+'_'+base,num,num+'_'+base+rar,unp+'_'+base,unp]
      :[num+'_'+base+rar,num,num+'_'+base,unp+'_'+base+rar,unp];
    urls=cands.map(function(x){return CDN+'/'+setCode+'/'+x+'.webp'}).concat(jpFallbacks(setCode,num));
  }
  return urls;
}
window.bbImgFallback=function(img){
  try{
    var alts=JSON.parse(img.dataset.alt||'[]');
    if(alts.length){img.dataset.alt=JSON.stringify(alts.slice(1));img.src=alts[0]}

};
function $(id){return document.getElementById(id)}
function won(n){return '₩'+Math.round(n).toLocaleString('ko-KR')}

// 세트 선택
var sel=$('setSel'),i;

  sel.appendChild(o);
}
function curSet(){return SETS[parseInt(sel.value,10)]}
function isHighClass(s){return s.cards.length>=85}

function packPrice(s){return s.box>0?s.box/packCount(s):0}
function updInfo(){
  var s=curSet();
  $('setInfo').textContent=(isHighClass(s)?'하이클래스 · 박스 10팩 × 10장':'일반 · 박스 30팩 × 5장')
    +(s.box>0?' · 박스 시세 '+won(s.box)+' (팩당 약 '+won(packPrice(s))+')':'')
    +(s.ev>0?' · 개봉 기대값 '+won(s.ev):'');
}
sel.addEventListener('change',updInfo);updInfo();

// ── 확률 모델 ──
function pool(s,tiers){
  var out=[],i2,c;
  for(i2=0;i2<s.cards.length;i2++){c=s.cards[i2];if(tiers.indexOf(c.r)>=0)out.push(c)}
  return out;
}
function pickFrom(s,tiers){
  var p=pool(s,tiers);
  if(!p.length)return null;
  return p[Math.floor(Math.random()*p.length)];
}
function rollHit(s){
  // 일반 세트 팩의 히트 슬롯 1개
  var r=Math.random();
  if(r<1/60&&pool(s,['UR','MUR','BWR']).length)return pickFrom(s,['UR','MUR','BWR']);
  if(r<1/16&&pool(s,['SAR','MA','SSR','HR','CSR']).length)return pickFrom(s,['SAR','MA','SSR','HR','CSR']);
  if(r<1/9&&pool(s,['SR']).length)return pickFrom(s,['SR']);
  if(r<1/7&&pool(s,['ACE','S']).length)return pickFrom(s,['ACE','S']);
  if(r<1/3&&pool(s,['AR','CHR','M']).length)return pickFrom(s,['AR','CHR','M']);
  return pickFrom(s,['RR','RRR','R'])||pickFrom(s,HIT_TIERS);
}
function buildPack(s){
  var n=cardsPerPack(s),cards=[],i2;
  if(isHighClass(s)){
    // 하이클래스: 팩당 히트 2~3장
    var hits=2+(Math.random()<0.5?1:0);
    for(i2=0;i2<n-hits;i2++)cards.push({norm:true});
    for(i2=0;i2<hits;i2++)cards.push(rollHit(s)||{norm:true});
  }else{
    for(i2=0;i2<n-1;i2++)cards.push({norm:true});
    cards.push(rollHit(s)||{norm:true});
  }
  return cards;
}
function buildBox(s){
  var packs=[],i2,hasBig=false,j2,c;
  for(i2=0;i2<packCount(s);i2++)packs.push(buildPack(s));
  // 박스 보장: SR급 이상 최소 1장
  for(i2=0;i2<packs.length;i2++)for(j2=0;j2<packs[i2].length;j2++){
    c=packs[i2][j2];
    if(!c.norm&&['SR','SAR','UR','MUR','BWR','MA','SSR','HR','CSR'].indexOf(c.r)>=0)hasBig=true;
  }
  if(!hasBig){
    var last=packs[packs.length-1];
    var g=pickFrom(s,['SR','SAR'])||pickFrom(s,HIT_TIERS);
    if(g)last[last.length-1]=g;
  }
  return packs;
}

function makeSlot(c){

      +'<span class="nm">'+c.n+'</span></div>'
      +'<div class="cap"><span class="rar" style="background:'+(RCOLOR[c.r]||'#64748b')+'">'+c.r+'</span> '
      +(c.p>0?won(c.p):'—')+'</div>';

function flipSlot(slot,c){

function checkPackDone(){

  var flipped=document.querySelectorAll('.cardSlot.flip').length;
  var curTotal=session.packs[session.idx].length;
  if(flipped>=curTotal){
    if(session.mode==='box'&&session.idx<session.packs.length-1){
      $('btnNext').style.display='inline-block';
    }else{
      showTally();
    }
  }
}
$('btnNext').addEventListener('click',function(){
  session.idx++;renderPack();
});
$('btnFlipAll').addEventListener('click',function(){
  this.disabled=true;
  if(session.mode==='box'){
    revealBoxAll();
  }else{
    revealAllSequential();
  }
});
function revealBoxAll(){
  // 전 팩 카드 수집 → 히트만 가격순 정렬해서 한 화면에 정리
  var all=[],hits=[],norm=0,i2,j2,c;
  for(i2=0;i2<session.packs.length;i2++){
    for(j2=0;j2<session.packs[i2].length;j2++){
      c=session.packs[i2][j2];all.push(c);
      if(c.norm){norm++}else{hits.push(c)}
    }
  }
  session.opened=all;
  hits.sort(function(a,b){return (b.p||0)-(a.p||0)});
  $('packTitle').textContent='📦 '+session.s.name+' — 박스 전체 결과 ('+session.packs.length+'팩)';
  $('btnNext').style.display='none';
  var host=$('packs');host.innerHTML='';
  var grid=document.createElement('div');grid.className='packGrid';
  for(i2=0;i2<hits.length;i2++){
    var slot=makeSlot(hits[i2]);
    // 클릭 없이 바로 공개 (짧은 시간차로 촤르륵)
    (function(sl,d){setTimeout(function(){sl.classList.add('flip')},d)})(slot,Math.min(i2*45,900));
    grid.appendChild(slot);
  }
  host.appendChild(grid);
  var nn=document.createElement('p');
  nn.style.cssText='font-size:13px;color:#5f6c7c;margin:12px 0 0';
  nn.textContent='💤 일반 카드 '+norm+'장은 생략했습니다. (가격순 정렬)';
  host.appendChild(nn);
  setTimeout(showTally,Math.min(hits.length*45,900)+300);
}
function revealAllSequential(){
  var slots=Array.prototype.slice.call(document.querySelectorAll('.cardSlot:not(.flip)'));
  var i2=0;
  function step(){
    if(i2<slots.length){
      slots[i2].click();i2++;
      setTimeout(step,90);
    }
  }
  step();
}
function showTally(){
  var opened=session.opened,total=0,hits=[],i2,c;
  for(i2=0;i2<opened.length;i2++){
    c=opened[i2];
    if(!c.norm){total+=c.p||0;hits.push(c)}
  }
  hits.sort(function(a,b){return (b.p||0)-(a.p||0)});
  var s=session.s;
  var cost=session.mode==='box'?s.box:packPrice(s);
  $('totalVal').textContent='총 가치 '+won(total);
  var f,ratio=cost>0?total/cost:1;
  if(ratio>=2)f='🔥🔥 초대박!! 오늘 로또 사러 가세요!!';
  else if(ratio>=1.3)f='🎉 대박! 본전 훌쩍 넘겼습니다!';
  else if(ratio>=0.9)f='🙂 본전 근처 — 나쁘지 않은 하루';
  else if(ratio>=0.5)f='😅 음... 카드는 소장가치죠?';
  else f='💧 오늘은 지갑을 닫으라는 계시입니다';
  $('fortune').textContent=f;
  $('vsCost').textContent=cost>0
    ?('투입 '+won(cost)+' → 회수율 '+Math.round(ratio*100)+'%')
    :'박스 시세 정보 없음';
  var hl='',top=hits.slice(0,12);
  for(i2=0;i2<top.length;i2++){
    hl+='<span style="color:'+(RCOLOR[top[i2].r]||'#93a1b3')+';font-weight:800">'+top[i2].r+'</span> '
      +top[i2].n+' <b>'+(top[i2].p>0?won(top[i2].p):'—')+'</b><br>';
  }
  if(hits.length>12)hl+='… 외 '+(hits.length-12)+'장';
  if(!hits.length)hl='히트 카드가 없습니다 😭';
  $('hits').innerHTML=hl;
  $('tally').style.display='block';
  $('tally').scrollIntoView({behavior:'smooth'});
}
$('btnPack').addEventListener('click',function(){startOpen('pack')});
$('btnBox').addEventListener('click',function(){startOpen('box')});
$('btnAgain').addEventListener('click',function(){startOpen(session.mode)});
})();
</script>
</body>
</html>
