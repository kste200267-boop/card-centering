<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>덱 빌더 · 대구 포켓몬 카드 방</title>
<style>
  :root{--bg:#F8F4FB;--paper:#fff;--ink:#1D1B16;--ink2:#5B5850;--line:#E6DEEE;--pink:#D64A9B;--pinkS:#FBE8F3;--blue:#5A7BD6;--blueS:#EAEFFC;--ok:#2E7D32;--warn:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;-webkit-text-size-adjust:100%}
  a{color:var(--blue)}
  .top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 12px}
  .top h1{margin:0 0 8px;font-size:18px}
  .row{display:flex;gap:6px;align-items:center}
  input,select,button{font:inherit}
  input[type=text],select{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  button{border:0;border-radius:10px;padding:9px 12px;background:var(--pink);color:#fff;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
  button.soft{background:var(--blueS);color:var(--blue)}
  button.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
  button:disabled{opacity:.45}
  .wrap{padding:10px 10px 120px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(6,1fr)}}
  .card{position:relative;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .card img{width:100%;display:block;aspect-ratio:63/88;object-fit:cover;background:#eee}
  .card .nm{font-size:10.5px;padding:3px 4px;line-height:1.2;height:30px;overflow:hidden;color:var(--ink2)}
  .card .cnt{position:absolute;top:4px;right:4px;background:var(--pink);color:#fff;font-size:12px;font-weight:700;border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}
  .card .cnt.z{display:none}
  .msg{color:var(--ink2);font-size:13px;padding:10px 2px}
  /* 덱 패널 */
  .deckbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:8px 12px env(safe-area-inset-bottom,8px)}
  .deckbar .st{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
  .deckbar .st b{font-size:16px}
  .deckbar .st .bad{color:var(--warn)}.deckbar .st .good{color:var(--ok)}
  .sheet{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35)}
  .sheet.on{display:block}
  .sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--paper);border-radius:16px 16px 0 0;padding:12px 12px env(safe-area-inset-bottom,12px);overflow:auto}
  .sheet h2{margin:0 0 8px;font-size:16px}
  .dl{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
  .dl img,.dl .noimg{width:38px;border-radius:4px;flex:0 0 38px}
  .dl .n{flex:1;font-size:14px}
  .dl .n small{display:block;color:var(--ink2);font-size:12px}
  .dl button{padding:5px 10px;font-size:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .chip{font-size:12px;background:var(--blueS);color:var(--blue);border-radius:999px;padding:3px 9px}
  textarea{width:100%;font:inherit;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:10px;min-height:80px}
  .detail img,.detail .noimg{width:100%;max-width:320px;display:block;margin:0 auto 8px;border-radius:10px;font-size:16px}
  .detail .atk{background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13.5px}
  .detail .atk b{display:block}
  .nav{display:flex;gap:6px;margin-top:6px}
  .nav a{flex:1;text-align:center;background:var(--blueS);color:var(--blue);padding:8px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:600}
.noimg{aspect-ratio:63/88;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.2;padding:4px;background:linear-gradient(135deg,#d9d2e6,#f0e9f7);color:#3a3452;border-radius:5px;word-break:keep-all}
  .card .noimg{border-radius:0}
</style>
</head>
<body>
<div class="top">
  <h1>🃏 덱 빌더</h1>
  <div class="row">
    <select id="setSel"><option>세트 불러오는 중…</option></select>
    <select id="langSel" style="flex:0 0 78px"><option value="ko">한국어</option><option value="ja">일본어</option><option value="en">영어</option></select>
  </div>
  <div class="row" style="margin-top:6px">
    <input type="text" id="q" placeholder="카드 이름 검색 (현재 세트)">
    <button type="button" class="soft" id="btnDecks">내 덱</button>
  </div>
</div>

<div class="wrap">
  <div class="msg" id="msg">세트를 고르면 카드가 나옵니다. 카드를 누르면 덱에 담기고, 길게 누르면 상세가 보여요.</div>
  <div class="grid" id="grid"></div>
</div>

<div class="deckbar">
  <div class="st"><span id="deckName">새 덱</span><b><span id="cnt">0</span>/60</b><span id="chk"></span></div>
  <div class="row">
    <button type="button" class="soft" id="btnOpen">덱 보기</button>
    <button type="button" id="btnSave">저장</button>
    <button type="button" class="ghost" id="btnCode">덱 코드</button>
    <button type="button" class="ghost" id="btnCheck">규칙 검사</button>
    <a href="battle.html" style="flex:1;text-align:center;background:var(--ink);color:#fff;padding:9px;border-radius:10px;text-decoration:none;font-weight:600">대전 →</a>
  </div>
</div>

<!-- 시트들 -->
<div class="sheet" id="shDeck"><div class="in">
  <h2>현재 덱 <small id="deckSum" style="font-weight:400;color:var(--ink2)"></small></h2>
  <div class="row"><input type="text" id="deckNameIn" placeholder="덱 이름"><button type="button" class="ghost" id="btnClear">비우기</button></div>
  <div id="deckList"></div>
  <div class="nav"><a href="#" id="closeDeck">닫기</a></div>
</div></div>

<div class="sheet" id="shDecks"><div class="in">
  <h2>저장된 덱</h2>
  <div id="decksList"></div>
  <p class="msg">이 브라우저에 저장됩니다. 다른 기기로 옮기려면 덱 코드를 카톡으로 보내고 그쪽에서 붙여넣기.</p>
  <div class="nav"><a href="#" id="newDeck">+ 새 덱</a><a href="#" id="closeDecks">닫기</a></div>
</div></div>

<div class="sheet" id="shCode"><div class="in">
  <h2>덱 코드</h2>
  <textarea id="codeOut" readonly></textarea>
  <div class="row" style="margin:6px 0"><button type="button" class="soft" id="btnCopy">복사</button></div>
  <h2 style="margin-top:12px">코드 붙여넣기</h2>
  <textarea id="codeIn" placeholder="받은 덱 코드를 붙여넣고 불러오기"></textarea>
  <div class="row" style="margin:6px 0"><button type="button" id="btnImport">불러오기</button></div>
  <div class="nav"><a href="#" id="closeCode">닫기</a></div>
</div></div>

<div class="sheet" id="shDetail"><div class="in detail" id="detailIn"></div></div>

<script>
var API = 'https://api.tcgdex.net/v2/';
var LANGS = ['ko','ja','en'];
var lang = localStorage.getItem('dgpk_lang') || 'ko';
var sets = [], curSet = null, cards = [], detailCache = {};
var deck = { name:'새 덱', lang:lang, cards:{} }; // id -> {id,name,img,n,cat}
var LS_DECKS = 'dgpk_decks';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function cardImgBase(c){ if(c.image) return c.image; if(curSet&&curSet.serie&&c.localId) return 'https://assets.tcgdex.net/'+lang+'/'+curSet.serie.id+'/'+curSet.id+'/'+c.localId; return ''; }

/* ---- 이미지: 한국어 없으면 일본어→영어 순으로 대체, 다 없으면 이름 표시 ---- */
var IMG_LANGS=['ko','ja','en'];
var LIMITLESS='https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpc/';
function jpCodes(setId){var s=String(setId||'');if(!s)return [];var out=[s];if(s.length>2){var p=s.slice(0,2).toLowerCase()+s.slice(2);out.push(p);out.push(p.slice(0,-1)+p.slice(-1).toLowerCase());out.push(p.slice(0,-1)+p.slice(-1).toUpperCase());}
  return out.filter(function(v,i){return out.indexOf(v)===i;});}
function imgCands(c,q){q=q||'low';var out=[];
  var id=String((c&&c.id)||'');var m=id.match(/^([^-]+)-(\d+)$/);
  if(m){var num=m[2];var pad=('000'+num).slice(-3);var un=String(parseInt(num,10));
    jpCodes(m[1]).forEach(function(code){out.push(LIMITLESS+code+'/'+code+'_'+pad+'_R_JP.png');if(un!==pad)out.push(LIMITLESS+code+'/'+code+'_'+un+'_R_JP.png');});}
  var base=c&&c.img;if(base){var t=base.match(/^(https:\/\/assets\.tcgdex\.net\/)([a-z-]+)(\/.+)$/);
    if(!t)out.push(base+'/'+q+'.webp');else{var langs=[t[2]].concat(IMG_LANGS.filter(function(l){return l!==t[2];}));langs.forEach(function(l){out.push(t[1]+l+t[3]+'/'+q+'.webp');});}}
  return out;}
function imgTagOf(c,q,cls){var cs=imgCands(c,q);if(!cs.length)return '<div class="noimg'+(cls?' '+cls:'')+'">'+esc(c&&c.name)+'</div>';
  return '<img src="'+cs[0]+'" data-alt="'+cs.slice(1).join('|')+'" data-name="'+esc(c&&c.name)+'" alt="" onerror="imgFallback(this)"'+(cls?' class="'+cls+'"':'')+' loading="lazy">';}
function imgFallback(el){var list=el.getAttribute('data-alt')?el.getAttribute('data-alt').split('|'):[];if(list.length){el.setAttribute('data-alt',list.slice(1).join('|'));el.src=list[0];return;}
  var d=document.createElement('div');d.className='noimg'+(el.className?' '+el.className:'');d.textContent=el.getAttribute('data-name')||'';el.parentNode&&el.parentNode.replaceChild(d,el);}

function total(){ var n=0; for(var k in deck.cards) n+=deck.cards[k].n; return n; }
function show(id,on){ $(id).classList.toggle('on', on!==false); }

/* ---------- 세트 ---------- */
function loadSets(){
  $('langSel').value = lang;
  fetch(API + lang + '/sets').then(function(r){ return r.json(); }).then(function(list){
    sets = list.filter(function(s){ return /^(sv|me|s|sm)/i.test(s.id); }).reverse();
    var sel = $('setSel'); sel.innerHTML = '';
    sets.forEach(function(s){ var o=document.createElement('option'); o.value=s.id; o.textContent=s.name+' ('+s.id+')'; sel.appendChild(o); });
    if(sets.length){ sel.value = sets[0].id; loadSet(sets[0].id); }
    else $('msg').textContent = '이 언어로는 세트 목록이 없어요. 언어를 바꿔 보세요.';
  }).catch(function(){ $('msg').textContent = '카드 데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'; });
}
function loadSet(id){
  $('msg').textContent = '불러오는 중…'; $('grid').innerHTML='';
  fetch(API + lang + '/sets/' + id).then(function(r){ return r.json(); }).then(function(s){
    curSet = s; cards = s.cards || [];
    $('msg').textContent = s.name + ' · ' + cards.length + '장';
    render();
  }).catch(function(){ $('msg').textContent = '세트를 불러오지 못했어요.'; });
}
function render(){
  var q = $('q').value.trim().toLowerCase();
  var g = $('grid'); g.innerHTML = '';
  cards.filter(function(c){ return !q || (c.name||'').toLowerCase().indexOf(q)>-1; }).forEach(function(c){
    var d = document.createElement('div'); d.className='card';
    var n = deck.cards[c.id] ? deck.cards[c.id].n : 0;
    d.innerHTML = imgTagOf({id:c.id,img:cardImgBase(c),name:c.name})+'<div class="nm">'+esc(c.name)+'<br>#'+esc(c.localId)+'</div><span class="cnt'+(n?'':' z')+'">'+n+'</span>';
    var t=null, longed=false;
    d.addEventListener('pointerdown', function(){ longed=false; t=setTimeout(function(){ longed=true; openDetail(c); },480); });
    d.addEventListener('pointermove', function(){ if(t){ clearTimeout(t); t=null; } });
    d.addEventListener('pointerup', function(e){ e.preventDefault(); if(t){ clearTimeout(t); t=null; if(!longed) add(c); } });
    d.addEventListener('pointercancel', function(){ if(t){ clearTimeout(t); t=null; } });
    d.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    g.appendChild(d);
  });
}

/* ---------- 덱 ---------- */
function add(c){
  var e = deck.cards[c.id] || (deck.cards[c.id] = {id:c.id, name:c.name, img:c.image, n:0});
  var sameName = 0; for(var k in deck.cards) if(deck.cards[k].name===c.name) sameName += deck.cards[k].n;
  var isEnergy = /에너지|Energy|エネルギー/.test(c.name) && !/특수|Special/.test(c.name);
  if(total() >= 60){ toast('60장이 꽉 찼어요'); return; }
  if(!isEnergy && sameName >= 4){ toast('같은 이름은 4장까지'); return; }
  e.n++; e.img = cardImgBase(c)||e.img; update();
}
function sub(id){ var e=deck.cards[id]; if(!e) return; e.n--; if(e.n<=0) delete deck.cards[id]; update(); }
function update(){
  var n = total(); $('cnt').textContent = n;
  var chk = $('chk'); chk.textContent = n===60 ? '✔ 60장' : (60-n)+'장 남음'; chk.className = n===60?'good':'bad';
  $('deckName').textContent = deck.name;
  render(); renderDeck();
}
function renderDeck(){
  var box=$('deckList'); box.innerHTML='';
  var list = Object.keys(deck.cards).map(function(k){ return deck.cards[k]; }).sort(function(a,b){ return a.name.localeCompare(b.name); });
  $('deckSum').textContent = total()+'장 · '+list.length+'종';
  list.forEach(function(e){
    var d=document.createElement('div'); d.className='dl';
    d.innerHTML=imgTagOf(e)+'<div class="n">'+esc(e.name)+'<small>'+esc(e.id)+'</small></div><button type="button" class="ghost">−</button><b>'+e.n+'</b><button type="button" class="soft">+</button>';
    d.querySelectorAll('button')[0].onclick=function(ev){ ev.preventDefault(); sub(e.id); };
    d.querySelectorAll('button')[1].onclick=function(ev){ ev.preventDefault(); add({id:e.id,name:e.name,image:e.img,localId:''}); };
    box.appendChild(d);
  });
  $('deckNameIn').value = deck.name;
}
function getDecks(){ try{ return JSON.parse(localStorage.getItem(LS_DECKS)||'[]'); }catch(e){ return []; } }
function saveDeck(){
  deck.name = $('deckNameIn').value.trim() || deck.name || '새 덱'; deck.lang = lang;
  var decks = getDecks(); var i = decks.findIndex(function(d){ return d.name===deck.name; });
  var copy = JSON.parse(JSON.stringify(deck)); copy.saved = Date.now();
  if(i>-1) decks[i]=copy; else decks.push(copy);
  try{ localStorage.setItem(LS_DECKS, JSON.stringify(decks)); toast('저장됨: '+deck.name); }catch(e){ toast('저장 실패 (저장공간)'); }
  update();
}
function renderDecks(){
  var box=$('decksList'); box.innerHTML='';
  var decks=getDecks(); if(!decks.length){ box.innerHTML='<p class="msg">저장된 덱이 없어요.</p>'; return; }
  decks.forEach(function(d,i){
    var n=0; for(var k in d.cards) n+=d.cards[k].n;
    var row=document.createElement('div'); row.className='dl';
    row.innerHTML='<div class="n">'+esc(d.name)+'<small>'+n+'장 · '+new Date(d.saved).toLocaleDateString('ko-KR')+'</small></div><button type="button" class="soft">열기</button><button type="button" class="ghost">삭제</button>';
    row.querySelectorAll('button')[0].onclick=function(e){ e.preventDefault(); deck=JSON.parse(JSON.stringify(d)); if(deck.lang && deck.lang!==lang){ lang=deck.lang; localStorage.setItem('dgpk_lang',lang); loadSets(); } update(); show('shDecks',false); };
    row.querySelectorAll('button')[1].onclick=function(e){ e.preventDefault(); if(!confirm('"'+d.name+'" 덱을 삭제할까요?')) return; decks.splice(i,1); localStorage.setItem(LS_DECKS,JSON.stringify(decks)); renderDecks(); };
    box.appendChild(row);
  });
}
function toCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify({name:deck.name,lang:deck.lang,cards:deck.cards})))); }
function fromCode(s){
  try{ var o=JSON.parse(decodeURIComponent(escape(atob(s.trim())))); if(!o.cards) throw 0; deck={name:o.name||'가져온 덱',lang:o.lang||lang,cards:o.cards}; update(); toast('불러옴: '+deck.name); return true; }
  catch(e){ toast('코드가 올바르지 않아요'); return false; }
}

/* ---------- 규칙 검사 (TCGdex 상세로 확인) ---------- */
var DCACHE_KEY='dgpk_dcache';
function dcacheGet(id){try{var c=JSON.parse(localStorage.getItem(DCACHE_KEY)||'{}');return c[id];}catch(e){return null;}}
function dcachePut(id,d){try{var c=JSON.parse(localStorage.getItem(DCACHE_KEY)||'{}');c[id]={name:d.name,category:d.category,stage:d.stage,rarity:d.rarity,regulationMark:d.regulationMark,energyType:d.energyType,trainerType:d.trainerType};var ks=Object.keys(c);if(ks.length>400)delete c[ks[0]];localStorage.setItem(DCACHE_KEY,JSON.stringify(c));}catch(e){}}
function checkDeck(){
  var ids=Object.keys(deck.cards);if(!ids.length){toast('덱이 비어 있어요');return;}
  $('detailIn').innerHTML='<h3>규칙 검사</h3><p class="msg" id="chkMsg">카드 정보 확인 중… (0/'+ids.length+')</p><div class="nav"><a href="#" onclick="show(\'shDetail\',false);return false">닫기</a></div>';show('shDetail');$('shDetail').onclick=function(e){if(e.target===$('shDetail'))show('shDetail',false);};
  var done=0,info={};
  function next(i){if(i>=ids.length){report(info);return;}var id=ids[i];var c=dcacheGet(id);
    var pr=c?Promise.resolve(c):fetch(API+lang+'/cards/'+id).then(function(r){return r.json();}).then(function(d){dcachePut(id,d);return d;}).catch(function(){return null;});
    pr.then(function(d){info[id]=d;done++;var m=$('chkMsg');if(m)m.textContent='카드 정보 확인 중… ('+done+'/'+ids.length+')';next(i+1);});}
  next(0);
}
function report(info){
  var n=total(),basics=0,ace=0,unknown=0,marks={},byName={},problems=[];
  Object.keys(deck.cards).forEach(function(id){var e=deck.cards[id],d=info[id];if(!d){unknown+=e.n;return;}
    if(d.category==='Pokemon'&&d.stage==='Basic')basics+=e.n;
    if(/ACE/i.test(d.rarity||''))ace+=e.n;
    if(d.regulationMark)marks[d.regulationMark]=(marks[d.regulationMark]||0)+e.n;
    var isBasicEnergy=d.category==='Energy'&&(d.energyType==='Normal'||/기본|Basic/.test(d.name));
    if(!isBasicEnergy)byName[d.name]=(byName[d.name]||0)+e.n;});
  if(n!==60)problems.push('총 '+n+'장 (60장이어야 함)');
  if(basics<1)problems.push('기본(Basic) 포켓몬이 없음 — 최소 1장');
  if(ace>1)problems.push('ACE SPEC '+ace+'장 (1장만 가능)');
  Object.keys(byName).forEach(function(k){if(byName[k]>4)problems.push(k+' '+byName[k]+'장 (같은 이름 4장까지)');});
  var mk=Object.keys(marks).sort().map(function(k){return k+':'+marks[k]+'장';}).join(' · ');
  var h='<h3>규칙 검사 결과</h3>'+(problems.length?'<ul style="color:var(--warn);padding-left:18px">'+problems.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p style="color:var(--ok);font-weight:700">✔ 기본 규칙 통과</p>')+
    '<p class="msg">기본 포켓몬 '+basics+'장 · ACE SPEC '+ace+'장'+(unknown?' · 정보 없음 '+unknown+'장':'')+'</p>'+(mk?'<p class="msg">레귤레이션 마크: '+mk+'<br>스탠다드 대회는 최신 마크만 허용되니 오래된 마크가 있으면 확인하세요.</p>':'')+
    '<div class="nav"><a href="#" onclick="show(\'shDetail\',false);return false">닫기</a></div>';
  $('detailIn').innerHTML=h;
}

/* ---------- 상세 ---------- */
function openDetail(c){
  var box=$('detailIn'); var bc={id:c.id,img:cardImgBase(c),name:c.name}; box.innerHTML=imgTagOf(bc,'high')+'<p class="msg">상세 불러오는 중…</p>'; show('shDetail');
  $('shDetail').onclick=function(e){ if(e.target===$('shDetail')) show('shDetail',false); };
  var p = detailCache[c.id] ? Promise.resolve(detailCache[c.id]) : fetch(API+lang+'/cards/'+c.id).then(function(r){ return r.json(); }).then(function(d){ detailCache[c.id]=d; return d; });
  p.then(function(d){
    var h=imgTagOf(bc,'high')+'<h2>'+esc(d.name)+' <small style="font-weight:400;color:var(--ink2)">'+esc(d.category)+(d.stage?' · '+esc(d.stage):'')+(d.hp?' · HP '+d.hp:'')+'</small></h2>';
    if(d.types) h+='<div class="chips">'+d.types.map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('')+(d.evolveFrom?'<span class="chip">← '+esc(d.evolveFrom)+'</span>':'')+'</div>';
    (d.abilities||[]).forEach(function(a){ h+='<div class="atk"><b>[특성] '+esc(a.name)+'</b>'+esc(a.effect||'')+'</div>'; });
    (d.attacks||[]).forEach(function(a){ h+='<div class="atk"><b>'+(a.cost||[]).map(function(x){return x[0];}).join('')+' '+esc(a.name)+(a.damage?' — '+esc(a.damage):'')+'</b>'+esc(a.effect||'')+'</div>'; });
    if(d.effect) h+='<div class="atk">'+esc(d.effect)+'</div>';
    var meta=[]; if(d.weaknesses) meta.push('약점 '+d.weaknesses.map(function(w){return w.type+w.value;}).join(',')); if(d.resistances) meta.push('저항 '+d.resistances.map(function(w){return w.type+w.value;}).join(',')); if(d.retreat!=null) meta.push('후퇴 '+d.retreat);
    if(meta.length) h+='<p class="msg">'+meta.join(' · ')+'</p>';
    h+='<div class="row"><button type="button" id="dAdd">덱에 담기</button><button type="button" class="ghost" id="dClose">닫기</button></div>';
    box.innerHTML=h; $('dAdd').onclick=function(e){ e.preventDefault(); add(c); }; $('dClose').onclick=function(e){ e.preventDefault(); show('shDetail',false); };
  }).catch(function(){ box.innerHTML+='<p class="msg">상세를 불러오지 못했어요.</p>'; });
}

var tt; function toast(m){ var t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1D1B16;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s'; document.body.appendChild(t);} t.textContent=m; t.style.opacity=1; clearTimeout(tt); tt=setTimeout(function(){ t.style.opacity=0; },1500); }

/* ---------- 이벤트 ---------- */
$('setSel').onchange=function(){ loadSet(this.value); };
$('langSel').onchange=function(){ lang=this.value; localStorage.setItem('dgpk_lang',lang); loadSets(); };
$('q').oninput=render;
$('btnOpen').onclick=function(e){ e.preventDefault(); renderDeck(); show('shDeck'); };
$('closeDeck').onclick=function(e){ e.preventDefault(); deck.name=$('deckNameIn').value.trim()||deck.name; update(); show('shDeck',false); };
$('btnClear').onclick=function(e){ e.preventDefault(); if(confirm('덱을 비울까요?')){ deck.cards={}; update(); } };
$('btnSave').onclick=function(e){ e.preventDefault(); if($('shDeck').classList.contains('on')) deck.name=$('deckNameIn').value.trim()||deck.name; saveDeck(); };
$('btnDecks').onclick=function(e){ e.preventDefault(); renderDecks(); show('shDecks'); };
$('closeDecks').onclick=function(e){ e.preventDefault(); show('shDecks',false); };
$('newDeck').onclick=function(e){ e.preventDefault(); deck={name:'새 덱 '+(getDecks().length+1),lang:lang,cards:{}}; update(); show('shDecks',false); };
$('btnCheck').onclick=function(e){e.preventDefault();checkDeck();};
$('btnCode').onclick=function(e){ e.preventDefault(); $('codeOut').value=toCode(); show('shCode'); };
$('closeCode').onclick=function(e){ e.preventDefault(); show('shCode',false); };
$('btnCopy').onclick=function(e){ e.preventDefault(); $('codeOut').select(); try{ document.execCommand('copy'); toast('복사됨'); }catch(x){} };
$('btnImport').onclick=function(e){ e.preventDefault(); if(fromCode($('codeIn').value)) show('shCode',false); };
['shDeck','shDecks','shCode'].forEach(function(id){ $(id).onclick=function(e){ if(e.target===$(id)) show(id,false); }; });

loadSets(); update();
</script>
</body>
</html>
