<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대구 포켓몬 카드 카톡방 공지</title>
<meta name="description" content="대구 포켓몬 카드 카톡방 공지 — 입장 규칙, 오픈프로필 만들기, 사기 예방, 카드 등급 기준, 대구 카드샵, 거래 게시판 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8F4FB;
    --paper:#FFFFFF;
    --ink:#1D1B16;
    --ink-2:#5B5850;
    --line:#E6DEEE;
    --red:#D64A9B;
    --red-soft:#FBE8F3;
    --yellow:#F5C842;
    --yellow-soft:#FFF7D6;
    --blue:#5A7BD6;
    --blue-soft:#EAEFFC;
    --radius:14px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:16px;line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%;
  }
  a{color:var(--blue)}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}

  /* 헤더 */
  .hero{text-align:center;padding:8px 4px 18px}
  .hero-img{
    width:min(72vw,300px);height:auto;aspect-ratio:1;border-radius:50%;display:block;margin:0 auto 14px;
    box-shadow:0 10px 30px rgba(214,74,155,.22),0 0 0 6px #fff,0 0 0 8px #F3D9EA;
  }
  .hero-tag{display:inline-block;font-size:13px;font-weight:600;color:var(--red);background:var(--red-soft);padding:3px 12px;border-radius:999px}
  .hero h1{margin:10px 0 6px;font-size:25px;line-height:1.25;font-weight:700;letter-spacing:-0.02em}
  .hero p{margin:0;color:var(--ink-2);font-size:15px}
  .hero .updated{margin-top:8px;font-size:13px;color:var(--ink-2)}

  /* 최상단 필수 공지 */
  .must{
    background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:18px;
  }
  .must strong{display:block;font-size:17px;margin-bottom:4px}
  .must p{margin:0;font-size:15px}

  /* 메뉴 = 아코디언 한 목록 */
  .menu-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
  .menu-head h2{margin:0;font-size:15px;font-weight:600;color:var(--ink-2)}
  .menu-head button{
    border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
    font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;
  }
  .sec{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;transition:border-color .15s;
  }
  .sec.open{border-color:var(--red)}
  .sec-head{
    width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;
    padding:12px 14px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .sec-head:active{background:#F3EDF8}
  .sec-head .badge{
    flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--c,#ddd);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);
  }
  .sec-head .badge svg{width:26px;height:26px;display:block}
  .sec-head .txt{flex:1;min-width:0}
  .sec-head .t{display:block;font-size:16.5px;font-weight:700;line-height:1.3}
  .sec-head .d{display:block;font-size:13px;color:var(--ink-2);line-height:1.35;margin-top:2px}
  .sec-head .chev{color:var(--ink-2);font-size:13px;transition:transform .2s;flex:0 0 auto}
  .sec.open .sec-head .chev{transform:rotate(180deg)}
  .sec.open .sec-head{border-bottom:1px solid var(--line)}
  .sec-body{display:none;padding:14px 16px 16px;font-size:15px}
  .sec.open .sec-body{display:block}
  .sec-body h3{margin:16px 0 6px;font-size:15px;font-weight:700;color:var(--ink)}
  .sec-body h3:first-child{margin-top:0}
  .sec-body p{margin:0 0 10px}
  .sec-body ul,.sec-body ol{margin:0 0 10px;padding-left:20px}
  .sec-body li{margin-bottom:6px}
  .sec-body .note{background:var(--blue-soft);border-left:4px solid var(--blue);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
  .sec-body .warn{background:var(--red-soft);border-left:4px solid var(--red);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
  .sec-body .link-btn{
    display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;
    padding:12px;border-radius:10px;font-weight:600;margin:10px 0;
  }
  .sec-body .link-btn.soft{background:var(--blue-soft);color:var(--blue)}
  .sec-body .back{margin-top:14px;font-size:13px;color:var(--ink-2);background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-decoration:underline}
  .menu-head button:focus-visible,.sec-head:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  
  /* 표 */
  .grade{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
  .grade th,.grade td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top;text-align:left}
  .grade th{width:46px;font-weight:700;white-space:nowrap}
  .grade tr:last-child td,.grade tr:last-child th{border-bottom:0}
  .g-S{color:#B8860B}.g-A{color:#2E7D32}.g-B{color:#2F5DA8}.g-C{color:#8E6A1F}.g-D{color:#B04A2A}.g-F{color:var(--red)}

  /* 카드샵 한눈에 표 */
  .shoptab-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px -4px 12px}
  .shoptab{border-collapse:collapse;font-size:13px;min-width:100%;white-space:nowrap}
  .shoptab th,.shoptab td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:center}
  .shoptab th{font-weight:700;background:var(--red-soft);font-size:12.5px}
  .shoptab td:first-child,.shoptab th:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:var(--paper)}
  .shoptab th:first-child{background:var(--red-soft)}
  .shoptab .y{color:#2E7D32;font-weight:700}.shoptab .q{color:#B9B3A8}
  .legend{font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
  .shop .map{display:inline-block;margin-top:4px;font-size:13px;color:var(--blue)}

  .reviews{font-size:14px}
  .rv-shop{margin:0 0 12px}
  .rv-shop b{display:block;font-size:14.5px;margin-bottom:4px}
  .rv{background:var(--bg);border-radius:10px;padding:8px 11px;margin-bottom:6px}
  .rv .m{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
  .rv .tags{font-size:11.5px;color:var(--blue)}

  /* 매장 목록 (누르면 펼침) */
  .shoplist{margin:0 0 10px}
  .shopc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--paper)}
  .shopc-h{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:11px 12px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .shopc-h .nm{font-weight:700;font-size:15px;flex:1;min-width:0}
  .shopc-h .nm small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
  .shopc-h .st{font-size:13px;color:#B8860B;font-weight:700;white-space:nowrap}
  .shopc-h .st.none{color:var(--ink-2);font-weight:400}
  .shopc-h .chev{color:var(--ink-2);font-size:12px;transition:transform .2s}
  .shopc.open .shopc-h .chev{transform:rotate(180deg)}
  .shopc-b{display:none;padding:0 12px 12px;border-top:1px solid var(--line)}
  .shopc.open .shopc-b{display:block}
  .shopc-b .addr{font-size:14px;color:var(--ink-2);margin:10px 0 6px}
  .shopc-b .hours{font-size:13.5px;margin:0 0 6px}
  .shopc-b .link-btn{margin:8px 0}
  .heart{color:var(--red)}

  .pray{text-align:center;background:var(--yellow-soft);border:1px dashed var(--yellow);border-radius:10px;padding:10px 12px;margin:-2px 0 10px;font-size:14px}
  .pray b{display:block;font-size:16px;margin-top:2px}

  /* 카드샵 */
  .shop{padding:10px 0;border-bottom:1px solid var(--line)}
  .shop:last-child{border-bottom:0}
  .shop b{display:block;font-size:15px}
  .shop span{display:block;font-size:14px;color:var(--ink-2)}
  .shop .map{font-size:13px}

  /* 단계 */
  .steps{counter-reset:s;list-style:none;padding:0;margin:0 0 10px}
  .steps li{position:relative;padding-left:34px;margin-bottom:10px;min-height:26px}
  .steps li::before{
    counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;
    width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }

  .foot{margin-top:28px;text-align:center;font-size:12.5px;color:var(--ink-2)}
  .foot a{color:var(--ink-2)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <img class="hero-img" src="leader.jpg" alt="우리방 대장 SoR">
    <span class="hero-tag">공지 · 필독</span>
    <h1>대구 포켓몬 카드<br>카톡방 안내</h1>

(function(){
  var secs = document.getElementById('sections');
  var must = document.getElementById('must');
  var toggleAll = document.getElementById('toggleAll');
  var allOpen = false;

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  document.getElementById('updated').textContent = UPDATED;
  must.innerHTML = '<strong>' + MUST.title + '</strong><p>' + MUST.text + '</p>';

  MENUS.forEach(function(m){
    var ic = ICONS[m.type] || ICONS.normal;
    var sec = document.createElement('section');
    sec.className = 'sec';
    sec.id = 'sec-' + m.id;
    sec.innerHTML =
      '<button type="button" class="sec-head" aria-expanded="false">' +
        '<span class="badge" style="--c:' + ic.c + '">' + ic.svg + '</span>' +
        '<span class="txt"><span class="t">' + esc(m.title) + '</span><span class="d">' + esc(m.desc||'') + '</span></span>' +
        '<span class="chev">▼</span>' +
      '</button>' +
      '<div class="sec-body">' + m.body +
        '<button type="button" class="back">▲ 접기</button>' +
      '</div>';
    sec.querySelector('.sec-head').addEventListener('click', function(e){
      e.preventDefault();
      sec.classList.contains('open') ? closeSec(m.id) : openSec(m.id, true);
    });
    sec.querySelector('.back').addEventListener('click', function(e){
      e.preventDefault(); closeSec(m.id);
      sec.scrollIntoView({behavior:'smooth', block:'start'});
    });
    secs.appendChild(sec);
  });

  function setState(id, open){
    var sec = document.getElementById('sec-' + id);
    if(!sec) return;
    sec.classList.toggle('open', open);
    sec.querySelector('.sec-head').setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function openSec(id, scroll){
    if(!allOpen){ MENUS.forEach(function(m){ if(m.id!==id) setState(m.id,false); }); }
    setState(id, true);
    if(scroll){
      var sec = document.getElementById('sec-' + id);
      setTimeout(function(){ sec.scrollIntoView({behavior:'smooth', block:'start'}); }, 30);
    }
    if(history.replaceState) history.replaceState(null, '', '#' + id);
  }
  function closeSec(id){ setState(id, false); }

  toggleAll.addEventListener('click', function(e){
    e.preventDefault();
    allOpen = !allOpen;
    MENUS.forEach(function(m){ setState(m.id, allOpen); });
    toggleAll.textContent = allOpen ? '전체 접기' : '전체 펼치기';
  });

  var COLS = [
    {key:'single', label:'싱글',   kw:'싱글'},
    {key:'oripa',  label:'오리파', kw:'오리파'},
    {key:'classic',label:'고전',   kw:'고전'},
    {key:'play',   label:'플레이', kw:'플레이'},
    {key:'box',    label:'정가박스',kw:'정가'}
  ];
  function shopLabel(r){ return (r.official ? '<span class="heart">♥</span> ' : '') + esc(r.name); }
  function starText(a){ return a.n ? '★ ' + a.avg.toFixed(1) + ' <small>(' + a.n + ')</small>' : '★ -'; }
  function mapUrl(r){ return r.map || ('https://map.naver.com/p/search/' + encodeURIComponent(r.addr)); }

  function renderTable(counts, ratings){
    var st = document.getElementById('shoptab'); if(!st) return;
    var html = '<table class="shoptab"><tr><th>매장</th><th>별점</th>';
    COLS.forEach(function(c){ html += '<th>' + c.label + '</th>'; });
    html += '</tr>';
    SHOPS.forEach(function(r){
      var a = ratings && ratings[r.name];
      html += '<tr><td>' + shopLabel(r) + '</td><td class="' + (a && a.n ? 'y' : 'q') + '">' + (a && a.n ? a.avg.toFixed(1) : '-') + '</td>';
      COLS.forEach(function(c){
        var n = counts && counts[r.name] ? (counts[r.name][c.key]||0) : 0;
        if(n>0) html += '<td class="y">✔ ' + n + '</td>';
        else if(r[c.key]===true) html += '<td class="y">✔</td>';
        else if(r[c.key]==='?') html += '<td class="q">?</td>';
        else html += '<td></td>';
      });
      html += '</tr>';
    });
    st.innerHTML = html + '</table>';
  }

  function renderShops(byShop, ratings){
    var list = document.getElementById('shoplist'); if(!list) return;
    list.innerHTML = '';
    SHOPS.forEach(function(r){
      var a = ratings && ratings[r.name];
      var rv = (byShop && byShop[r.name]) || [];
      var card = document.createElement('div'); card.className = 'shopc';
      var body = '<p class="addr">' + esc(r.addr) + (r.note ? '<br>' + esc(r.note) : '') + '</p>' +
                 (r.hours ? '<p class="hours">' + esc(r.hours) + '</p>' : '') +
                 '<a class="link-btn soft" href="' + mapUrl(r) + '" target="_blank" rel="noopener">네이버지도에서 보기</a>';
      if(rv.length){
        rv.slice(0,5).forEach(function(v){
          body += '<div class="rv">' + (v.text ? esc(v.text) : '<span class="legend">(취급 품목만 제보)</span>') +
                  '<span class="m">' + (v.star ? '★' + v.star + ' · ' : '') + esc(v.nick) + ' · ' + esc(v.when) + (v.items ? ' · <span class="tags">' + esc(v.items) + '</span>' : '') + '</span></div>';
        });
      } else body += '<p class="legend">아직 리뷰가 없어요.</p>';
      card.innerHTML =
        '<button type="button" class="shopc-h"><span class="nm">' + shopLabel(r) + '<small>' + esc(r.area) + '</small></span>' +
        '<span class="st' + (a && a.n ? '' : ' none') + '">' + starText(a||{n:0}) + '</span><span class="chev">▼</span></button>' +
        '<div class="shopc-b">' + body + '</div>';
      card.querySelector('.shopc-h').addEventListener('click', function(e){ e.preventDefault(); card.classList.toggle('open'); });
      list.appendChild(card);
    });
  }

  function parseCSV(text){
    var rows=[],row=[],cur='',q=false;
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=ch;
    }
    if(cur!==''||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function shopKey(name){
    name = (name||'').trim();
    for(var i=0;i<SHOPS.length;i++){ var n=SHOPS[i].name; if(name.indexOf(n)>-1 || (name && n.indexOf(name)>-1)) return n; }
    return null;
  }
  function colIndex(head, kw, fallback){
    for(var i=0;i<head.length;i++){ if(String(head[i]).indexOf(kw)>-1) return i; }
    return fallback;
  }
  function loadReviews(){
    var btn = document.getElementById('reviewBtn');
    if(btn) btn.href = REVIEW.form;
    renderTable(null, null); renderShops(null, null);
    fetch(REVIEW.csv + '&t=' + Date.now()).then(function(r){ return r.text(); }).then(function(t){
      var rows = parseCSV(t); var head = rows.shift() || [];
      var iShop = colIndex(head,'매장',1), iItems = colIndex(head,'품목',2), iText = colIndex(head,'리뷰',3),
          iNick = colIndex(head,'닉네임',4), iCode = colIndex(head,'인증',5), iStar = colIndex(head,'별점',-1);
      var counts = {}, byShop = {}, ratings = {}, seen = {};
      rows.forEach(function(r){
        if(String(r[iCode]||'').trim()!==REVIEW.code) return;
        var shop = shopKey(r[iShop]); if(!shop) return;
        var items = r[iItems]||'', nick = (r[iNick]||'').trim()||'익명', text = (r[iText]||'').trim();
        var star = iStar>-1 ? parseFloat(String(r[iStar]).replace(/[^0-9.]/g,'')) : NaN;
        counts[shop] = counts[shop] || {}; byShop[shop] = byShop[shop] || []; ratings[shop] = ratings[shop] || {n:0,sum:0,avg:0};
        var k = shop + '|' + nick;
        if(!seen[k]){ seen[k]=1; COLS.forEach(function(c){ if(items.indexOf(c.kw)>-1) counts[shop][c.key]=(counts[shop][c.key]||0)+1; }); }
        if(!isNaN(star) && star>=1 && star<=5){ ratings[shop].n++; ratings[shop].sum+=star; ratings[shop].avg = ratings[shop].sum/ratings[shop].n; }
        byShop[shop].unshift({nick:nick, text:text, items:items, star:(isNaN(star)?'':star), when:(r[0]||'').split(' ')[0]});
      });
      renderTable(counts, ratings); renderShops(byShop, ratings);
    }).catch(function(){ /* CSV 못 읽으면 기본값 그대로 표시 */ });
  }
  loadReviews();

  var pr = document.getElementById('pray');
  if(pr){
    if(RESERVE_PAUSE.active){
      var kst = new Date(Date.now() + 9*3600*1000);
      var today = Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate());
      var p0 = RESERVE_PAUSE.since.split('-');
      var start = Date.UTC(+p0[0], +p0[1]-1, +p0[2]);
      var day = Math.floor((today - start)/86400000) + 1;
      if(day < 1) day = 1;
      pr.innerHTML = '예약은 현재 <b>정지 중</b>' + '🙏 예약 정상화 기원 <b>' + day + '일차</b> 🙏'.replace('<b>','<b style="display:inline">');
      pr.innerHTML = '예약은 현재 정지 중입니다<b>🙏 예약 정상화 기원 ' + day + '일차 🙏</b>';
    } else pr.style.display = 'none';
  }

  /* 링크에 #메뉴id 가 붙어 있으면 그 메뉴를 바로 펼침 (예: notice.html#openprofile) */
  var h = location.hash.replace('#','');
  if(h){ openSec(h, true); }
})();
</script>
