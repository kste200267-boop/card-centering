<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대구 포켓몬 카드 카톡방 공지</title>
<meta name="description" content="대구 포켓몬 카드 카톡방 공지 — 입장 규칙, 오픈프로필 만들기, 사기 예방, 카드 등급 기준, 대구 카드샵, 거래 게시판 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF;
    --paper:#FFFFFF;
    --ink:#1D1B16;
    --ink-2:#5B5850;
    --line:#E5E1D6;
    --red:#D0342C;
    --red-soft:#FBEBE9;
    --yellow:#F5C518;
    --yellow-soft:#FFF6D1;
    --blue:#2F5DA8;
    --blue-soft:#E8EFFA;
    --radius:14px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:16px;line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%;
  }
  a{color:var(--blue)}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}

  /* 헤더 */
  .hero{padding:12px 4px 18px}
  .hero-tag{display:inline-block;font-size:13px;font-weight:600;color:var(--red);background:var(--red-soft);padding:3px 10px;border-radius:999px}
  .hero h1{margin:10px 0 6px;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-0.02em}
  .hero p{margin:0;color:var(--ink-2);font-size:15px}
  .hero .updated{margin-top:8px;font-size:13px;color:var(--ink-2)}

  /* 최상단 필수 공지 */
  .must{
    background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:18px;
  }
  .must strong{display:block;font-size:17px;margin-bottom:4px}
  .must p{margin:0;font-size:15px}

  /* 메뉴 격자 */
  .menu-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
  .menu-head h2{margin:0;font-size:15px;font-weight:600;color:var(--ink-2)}
  .menu-head button{
    border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
    font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .tile{
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px 12px;cursor:pointer;font:inherit;color:var(--ink);
    -webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s;
  }
  .tile:active{background:#F1EEE5}
  .tile.on{border-color:var(--red);background:var(--red-soft)}
  .tile .ico{font-size:26px;line-height:1}
  .tile .t{font-size:15px;font-weight:600;line-height:1.3}
  .tile .d{font-size:12.5px;color:var(--ink-2);line-height:1.35}
  .tile.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:12px}
  .tile.wide .t{font-size:16px}
  .tile:focus-visible,.menu-head button:focus-visible,.sec-head:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  /* 상세 섹션 */
  .sec{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;
  }
  .sec-head{
    width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;
    padding:14px 16px;font:inherit;font-size:17px;font-weight:700;color:var(--ink);
    text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .sec-head .ico{font-size:22px}
  .sec-head .chev{margin-left:auto;color:var(--ink-2);font-size:14px;transition:transform .2s}
  .sec.open .sec-head .chev{transform:rotate(180deg)}
  .sec.open .sec-head{border-bottom:1px solid var(--line)}
  .sec-body{display:none;padding:14px 16px 16px;font-size:15px}
  .sec.open .sec-body{display:block}
  .sec-body h3{margin:16px 0 6px;font-size:15px;font-weight:700;color:var(--ink)}
  .sec-body h3:first-child{margin-top:0}
  .sec-body p{margin:0 0 10px}
  .sec-body ul,.sec-body ol{margin:0 0 10px;padding-left:20px}
  .sec-body li{margin-bottom:6px}
  .sec-body .note{background:var(--blue-soft);border-left:4px solid var(--blue);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
  .sec-body .warn{background:var(--red-soft);border-left:4px solid var(--red);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
  .sec-body .link-btn{
    display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;
    padding:12px;border-radius:10px;font-weight:600;margin:10px 0;
  }
  .sec-body .link-btn.soft{background:var(--blue-soft);color:var(--blue)}
  .sec-body .back{margin-top:14px;font-size:13px;color:var(--ink-2);background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-decoration:underline}

  /* 표 */
  .grade{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
  .grade th,.grade td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top;text-align:left}
  .grade th{width:46px;font-weight:700;white-space:nowrap}
  .grade tr:last-child td,.grade tr:last-child th{border-bottom:0}
  .g-S{color:#B8860B}.g-A{color:#2E7D32}.g-B{color:#2F5DA8}.g-C{color:#8E6A1F}.g-D{color:#B04A2A}.g-F{color:var(--red)}

  /* 카드샵 */
  .shop{padding:10px 0;border-bottom:1px solid var(--line)}
  .shop:last-child{border-bottom:0}
  .shop b{display:block;font-size:15px}
  .shop span{display:block;font-size:14px;color:var(--ink-2)}
  .shop .map{font-size:13px}

  /* 단계 */
  .steps{counter-reset:s;list-style:none;padding:0;margin:0 0 10px}
  .steps li{position:relative;padding-left:34px;margin-bottom:10px;min-height:26px}
  .steps li::before{
    counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;
    width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }

  .foot{margin-top:28px;text-align:center;font-size:12.5px;color:var(--ink-2)}
  .foot a{color:var(--ink-2)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <span class="hero-tag">공지 · 필독</span>
    <h1>대구 포켓몬 카드<br>카톡방 안내</h1>
    <p>아래 메뉴를 누르면 해당 안내가 펼쳐집니다.</p>
    <div class="updated" id="updated"></div>

  <div class="menu-head">

  </div>
  <div class="grid" id="grid"></div>

  <div id="sections"></div>

  <div class="foot">

</div>

/* ---------------- 렌더링 (건드리지 않아도 됨) ---------------- */
(function(){
  var grid = document.getElementById('grid');
  var secs = document.getElementById('sections');
  var must = document.getElementById('must');
  var toggleAll = document.getElementById('toggleAll');
  var allOpen = false;

  document.getElementById('updated').textContent = UPDATED;
  must.innerHTML = '<strong>' + MUST.title + '</strong><p>' + MUST.text + '</p>';

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  MENUS.forEach(function(m){
    var tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile' + (m.wide ? ' wide' : '');
    tile.setAttribute('data-id', m.id);
    tile.innerHTML = '<span class="ico">' + m.icon + '</span><span><span class="t">' + esc(m.title) + '</span><br><span class="d">' + esc(m.desc||'') + '</span></span>';
    tile.addEventListener('click', function(e){ e.preventDefault(); openSec(m.id, true); });
    grid.appendChild(tile);

    var sec = document.createElement('section');
    sec.className = 'sec';
    sec.id = 'sec-' + m.id;
    sec.innerHTML =
      '<button type="button" class="sec-head" aria-expanded="false">' +
        '<span class="ico">' + m.icon + '</span><span>' + esc(m.title) + '</span><span class="chev">▼</span>' +
      '</button>' +
      '<div class="sec-body">' + m.body +
        '<button type="button" class="back">▲ 메뉴로 돌아가기</button>' +
      '</div>';
    sec.querySelector('.sec-head').addEventListener('click', function(e){
      e.preventDefault();
      sec.classList.contains('open') ? closeSec(m.id) : openSec(m.id, false);
    });
    sec.querySelector('.back').addEventListener('click', function(e){
      e.preventDefault();
      closeSec(m.id);
      grid.scrollIntoView({behavior:'smooth', block:'start'});
    });
    secs.appendChild(sec);
  });

  function setState(id, open){
    var sec = document.getElementById('sec-' + id);
    var tile = grid.querySelector('[data-id="' + id + '"]');
    if(!sec) return;
    sec.classList.toggle('open', open);
    sec.querySelector('.sec-head').setAttribute('aria-expanded', open ? 'true' : 'false');
    if(tile) tile.classList.toggle('on', open);
  }
  function openSec(id, fromTile){
    if(!allOpen){ MENUS.forEach(function(m){ if(m.id!==id) setState(m.id,false); }); }
    setState(id, true);
    if(fromTile){
      var sec = document.getElementById('sec-' + id);
      setTimeout(function(){ sec.scrollIntoView({behavior:'smooth', block:'start'}); }, 30);
    }
    if(history.replaceState) history.replaceState(null, '', '#' + id);
  }
  function closeSec(id){ setState(id, false); }

  toggleAll.addEventListener('click', function(e){
    e.preventDefault();
    allOpen = !allOpen;
    MENUS.forEach(function(m){ setState(m.id, allOpen); });
    toggleAll.textContent = allOpen ? '전체 접기' : '전체 펼치기';
  });

  /* 링크에 #메뉴id 가 붙어 있으면 그 메뉴를 바로 펼침 (예: notice.html#openprofile) */
  var h = location.hash.replace('#','');
  if(h){ openSec(h, true); }
})();
</script>
