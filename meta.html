  .sub{color:var(--ink2);font-size:13.5px;margin:0 0 14px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

  .q{font-size:16px;font-weight:700;margin:0 0 10px}
  .opts{display:grid;gap:8px}
  .opts button{text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:12px 14px;font-weight:500}
  .opts button.on{border-color:var(--pink);background:var(--pinkS)}
  .prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pink);width:0;transition:width .3s}
  .res{display:flex;gap:10px;align-items:flex-start}
  .res .pct{flex:0 0 64px;height:64px;border-radius:50%;background:var(--pinkS);color:var(--pink);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
  .res b{display:block;font-size:16px}.res small{color:var(--ink2);display:block;font-size:12.5px}
  .tier{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--yel);margin-left:4px}
  .desc{font-size:13.5px;color:var(--ink2);margin:8px 0}
  .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .row button,.row a{flex:1;text-align:center;text-decoration:none;font-size:14px}
  .row a{background:var(--blueS);color:var(--blue);padding:10px;border-radius:10px;font-weight:600}
  .type{font-size:12px;color:var(--ink2);margin-top:6px}
  .bar{display:flex;gap:4px;margin-top:6px}.bar span{flex:1;height:5px;border-radius:3px;background:var(--line)}.bar span.on{background:var(--blue)}
  .lbl{font-size:11px;color:var(--ink2);display:flex;justify-content:space-between}
  .log{font-size:12.5px;color:var(--ink2);white-space:pre-line;max-height:160px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px}
  textarea{width:100%;font:inherit;font-size:12.5px;padding:8px;border:1px solid var(--line);border-radius:10px;min-height:110px}
  input[type=text]{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px}
  .all .it{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .all .it:last-child{border:0}.all .it b{flex:1}.all .it .no{color:var(--ink2);font-size:12px}

</style>
</head>

 {q:"덱을 고를 때 더 끌리는 쪽은?",o:[["기본 포켓몬 위주, 바로 싸우기",{evo:-2,aggro:1}],["진화 라인을 키워서 강한 어태커 완성",{evo:2}],["상관없음, 이기는 덱이면 됨",{consist:1}]]},
 {q:"규칙과 카드 효과를 익히는 건?",o:[["최대한 단순한 게 좋다",{complex:-2}],["적당히, 몇 개는 외울 수 있다",{complex:0}],["복잡할수록 재밌다",{complex:2}]]},
 {q:"지고 있을 때 나는?",o:[["더 세게 밀어붙인다",{aggro:2}],["상대 자원을 끊어서 뒤집을 틈을 만든다",{control:2}],["역전 콤보를 찾는다",{complex:1,consist:-1}]]},
 {q:"경기 길이는?",o:[["짧고 굵게, 5턴 안에 끝",{aggro:2,control:-1}],["길게 가도 괜찮다, 천천히 조여가기",{control:2,aggro:-1}],["상관없다",{}]]},
 {q:"카드 살 예산은?",o:[["최소로, 저렴한 덱",{budget:1}],["적당히",{}],["강하면 얼마든지",{budget:-1}]]},
 {q:"대회 성적 vs 재미?",o:[["무조건 이기는 덱 (1티어)",{tier:2}],["재밌으면 2~3티어도 좋다",{tier:-1}],["남들 안 쓰는 덱이 좋다",{tier:-2,complex:1}]]}
];
var ans=[],cur=0;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function showQ(){var q=Q[cur];$('prog').style.width=(cur/Q.length*100)+'%';$('qtext').textContent=(cur+1)+'. '+q.q;
  $('opts').innerHTML=q.o.map(function(o,i){return '<button type="button" data-i="'+i+'" class="'+(ans[cur]===i?'on':'')+'">'+esc(o[0])+'</button>';}).join('');
  document.querySelectorAll('#opts button').forEach(function(b){b.onclick=function(){ans[cur]=+b.dataset.i;if(cur<Q.length-1){cur++;showQ();}else finish();};});
  $('prev').disabled=cur===0;}
$('prev').onclick=function(){if(cur>0){cur--;showQ();}};
function finish(){var s={aggro:0,control:0,complex:0,evo:0,consist:0,budget:0,tier:0};
  ans.forEach(function(a,i){var w=Q[i].o[a][1];for(var k in w)s[k]+=w[k];});
  var scored=META.map(function(m){var st=m.style;var d=0;
    d+=Math.abs((st.aggro-3)-s.aggro*0.9); d+=Math.abs((st.control-3)-s.control*0.9); d+=Math.abs((st.complex-3)-s.complex*0.9); d+=Math.abs((st.evo-3)-s.evo*0.9); d+=Math.abs((st.consist-3)-s.consist*0.7);
    d+=(s.tier>0?(m.tier-1)*1.2:s.tier<0?(3-m.tier)*0.8:0);
    var pct=Math.max(35,Math.round(100-d*6.5));return {m:m,pct:pct};}).sort(function(a,b){return b.pct-a.pct;});
  var top=scored.slice(0,3);
  $('quiz').classList.add('hide');var r=$('result');r.classList.remove('hide');
  r.innerHTML='<div class="card"><b>🎯 내 스타일 결과</b><p class="sub" style="margin:4px 0 0">'+styleLabel(s)+'</p></div>'+top.map(function(t,i){return deckCard(t.m,t.pct,i===0);}).join('')+
    '<div class="row"><button type="button" class="ghost" onclick="ans=[];cur=0;$(\'result\').classList.add(\'hide\');$(\'quiz\').classList.remove(\'hide\');showQ();window.scrollTo(0,0)">다시 하기</button></div>';
  bindBuild();window.scrollTo(0,0);}
function styleLabel(s){var a=[];a.push(s.aggro>=s.control?'⚔️ 공격형':'🛡️ 컨트롤형');a.push(s.complex>=1?'🧠 콤보 선호':s.complex<=-1?'🎯 단순 선호':'⚖️ 균형');a.push(s.evo>=1?'🧬 진화 덱':s.evo<=-1?'⚡ 기본 포켓몬 덱':'🎲 상관없음');return a.join(' · ');}
function bars(st){return ['aggro','control','complex','evo','consist'].map(function(k,i){var lab=['공격','견제','복잡도','진화','안정'][i];return '<div class="lbl"><span>'+lab+'</span></div><div class="bar">'+[1,2,3,4,5].map(function(n){return '<span class="'+(n<=st[k]?'on':'')+'"></span>';}).join('')+'</div>';}).join('');}
function deckCard(m,pct,first){return '<div class="card"><div class="res"><div class="pct">'+(pct!=null?pct+'%':'')+'</div><div style="flex:1"><b>'+esc(m.name)+'<span class="tier">'+m.tier+'티어 · '+esc(m.share)+'</span></b><small>'+esc(m.en)+' · 난이도 '+esc(m.diff)+'</small></div></div>'+
  '<p class="desc">'+esc(m.desc)+'</p>'+bars(m.style)+
  '<div class="row">'+(m.cards?'<button type="button" data-build="'+m.id+'">'+(first?'⚡ 이 덱 바로 만들기':'이 덱 만들기')+'</button>':'<button type="button" class="soft" data-src="'+m.src+'">Limitless에서 리스트 복사 →</button>')+'<a href="'+m.src+'" target="_blank" rel="noopener">대회 리스트 보기</a></div>'+
  (m.cards?'':'<p class="type">아직 카드 목록이 안 들어간 덱이에요. 링크에서 [Copy to Clipboard] 후 아래 붙여넣기 칸에 넣으면 바로 만들어집니다.</p>')+'<div class="log hide" id="log-'+m.id+'"></div></div>';}
function bindBuild(){document.querySelectorAll('[data-build]').forEach(function(b){b.onclick=function(){var m=META.find(function(x){return x.id===b.dataset.build;});buildDeck(m.name,m.cards,$('log-'+m.id),b);};});
  document.querySelectorAll('[data-src]').forEach(function(b){b.onclick=function(){window.open(b.dataset.src,'_blank');$('impText').focus();};});}
$('all').innerHTML=META.map(function(m,i){return '<div class="it"><span class="no">'+(i+1)+'</span><b>'+esc(m.name)+'</b><span class="no">'+m.tier+'T · '+esc(m.share)+(m.cards?'':' · 목록 필요')+'</span><button type="button" class="soft" style="padding:5px 9px;font-size:12.5px" data-show="'+m.id+'">보기</button></div>';}).join('');
document.querySelectorAll('[data-show]').forEach(function(b){b.onclick=function(){var m=META.find(function(x){return x.id===b.dataset.show;});$('quiz').classList.add('hide');var r=$('result');r.classList.remove('hide');r.innerHTML=deckCard(m,null,true)+'<div class="row"><button type="button" class="ghost" onclick="ans=[];cur=0;$(\'result\').classList.add(\'hide\');$(\'quiz\').classList.remove(\'hide\');showQ();window.scrollTo(0,0)">퀴즈로 돌아가기</button></div>';bindBuild();window.scrollTo(0,0);};});

/* ---------- 덱 생성 (TCGdex 영어 데이터로 카드 찾기) ---------- */
var setsP=null,setMap={};
function loadSets(){if(setsP)return setsP;setsP=fetch(API+'sets').then(function(r){return r.json();}).then(function(list){list.forEach(function(s){setMap[String(s.name).toLowerCase()]=s.id;});return setMap;});return setsP;}
function setId(code){var nm=(SETNAMES[code]||'').toLowerCase();if(!nm)return null;if(setMap[nm])return setMap[nm];for(var k in setMap){if(k===nm)return setMap[k];}for(var k2 in setMap){if(k2.indexOf(nm)===0)return setMap[k2];}return null;}
var nameCache={};
function findCard(name,code,num){var key=name.toLowerCase();
  var p=nameCache[key]?Promise.resolve(nameCache[key]):fetch(API+'cards?name='+encodeURIComponent(name)).then(function(r){return r.json();}).then(function(a){nameCache[key]=Array.isArray(a)?a:[];return nameCache[key];}).catch(function(){return [];});
  return p.then(function(list){if(!list.length)return null;var sid=setId(code);var n=String(num);
    var exact=list.filter(function(c){return String(c.name).toLowerCase()===key;});var pool=exact.length?exact:list;
    var hit=pool.find(function(c){return sid&&c.id.indexOf(sid+'-')===0&&String(parseInt(c.localId,10))===String(parseInt(n,10));})
      ||pool.find(function(c){return sid&&c.id.indexOf(sid+'-')===0;})
      ||pool.find(function(c){return String(parseInt(c.localId,10))===String(parseInt(n,10));})
      ||pool[pool.length-1];
    return hit;});}
function buildDeck(name,cards,logEl,btn){if(btn){btn.disabled=true;btn.textContent='만드는 중…';}
  if(logEl){logEl.classList.remove('hide');logEl.textContent='카드 정보 불러오는 중…';}
  var deck={name:name,lang:'en',cards:{}},miss=[],done=0;
  loadSets().then(function(){var chain=Promise.resolve();
    cards.forEach(function(c){chain=chain.then(function(){return findCard(c[1],c[2],c[3]).then(function(hit){done++;if(logEl)logEl.textContent='카드 찾는 중… '+done+'/'+cards.length;
      if(!hit){miss.push(c[0]+' '+c[1]+' '+c[2]+' '+c[3]);return;}
      var e=deck.cards[hit.id]||(deck.cards[hit.id]={id:hit.id,name:hit.name,img:hit.image||'',n:0});e.n+=c[0];});});});
    return chain;}).then(function(){
    var total=0;for(var k in deck.cards)total+=deck.cards[k].n;
    var arr=[];try{arr=JSON.parse(localStorage.getItem('dgpk_decks')||'[]');}catch(e){}
    var i=arr.findIndex(function(d){return d.name===deck.name;});deck.saved=Date.now();if(i>-1)arr[i]=deck;else arr.push(deck);
    localStorage.setItem('dgpk_decks',JSON.stringify(arr));localStorage.setItem('dgpk_lang','en');
    var msg='✔ "'+name+'" 저장 완료 ('+total+'장)'+(miss.length?'\n못 찾은 카드 '+miss.length+'장 — 덱 빌더에서 직접 추가하세요:\n'+miss.join('\n'):'');
    if(logEl)logEl.textContent=msg;
    if(btn){btn.disabled=false;btn.textContent='✔ 저장됨 — 대전 페이지에서 선택';}
    var code=btoa(unescape(encodeURIComponent(JSON.stringify({name:deck.name,lang:'en',cards:deck.cards}))));
    if(logEl)logEl.innerHTML+='<div class="row"><a href="battle.html">⚔️ 대전으로</a><a href="deck.html">🃏 덱 빌더에서 수정</a></div><p class="type">덱 코드 (카톡 공유용): <textarea readonly style="min-height:60px">'+code+'</textarea></p>';
  }).catch(function(){if(logEl)logEl.textContent='카드 데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';if(btn){btn.disabled=false;btn.textContent='다시 시도';}});}

/* ---------- 붙여넣기 임포트 ---------- */
$('impBtn').onclick=function(){var t=$('impText').value,name=$('impName').value.trim()||'가져온 덱';var cards=[];
  t.split(/\n/).forEach(function(line){var m=line.trim().match(/^(\d+)\s+(.+?)\s+([A-Z]{2,4})\s+(\d+[a-zA-Z]?)$/);if(m)cards.push([+m[1],m[2],m[3],m[4]]);});
  if(!cards.length){alert('형식을 못 읽었어요. "4 Dreepy TWM 128" 같은 줄이 필요합니다.');return;}
  buildDeck(name,cards,$('impLog'),$('impBtn'));};

showQ();
</script>
